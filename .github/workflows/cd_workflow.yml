name: CD to Ubuntu Server

on:
  push:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          GOOGLE_MAIL: ${{ secrets.GOOGLE_MAIL }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}


      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{secrets.SSH_PORT}}
          source: "target/*.jar"
          target: "~/"
          rm: false
          timeout: '30s'
          command_timeout: '10m'
          use_insecure_cipher: false
          debug: true

      # 유레카에 서버를 DOWN 상태로 알림
      - name: Notify Eureka to set instance status to DOWN
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Notifying Eureka to set instance status to DOWN..."
            curl -X POST http://localhost:${{ secrets.BACK_PORT }}/api/actuator/status
            echo "Eureka notified."

      # 유레카 로드밸런싱할 캐시 시간 (1분 대기)
      - name: Wait for traffic to shift
        run: sleep 60

      # 앱 포트로 실행된 jar 파일 종료
      - name: Stop existing Spring Boot application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Stopping existing application..."
            pid=$(lsof -t -i:${{ secrets.BACK_PORT }}) && kill -9 $pid || echo "No application running on port ${{ secrets.BACK_PORT }}"

      #앱 포트로 배포 한 jar 파일 실행
      - name: execute shell script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            echo "Starting new application..."
            source ~/.bashrc
            nohup java -Xmx256m -jar ~/target/BOOK-STORE-BACK.jar --spring.profiles.active=prod --server.port=${{ secrets.BACK_PORT }} --spring.datasource.password=${{ secrets.MYSQL_PASSWORD }} --spring.data.redis.password=${{ secrets.REDIS_PASSWORD }} > BACK-A.log 2>&1 &
            echo "New application started. Check app.log for details."
      

      # JAR 파일 실행 확인
      - name: Check if JAR is running by checking log file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Checking if application is running by checking log file..."
            for i in {1..100}; do
              if grep -q "Started BookStoreBackApplication" BACK-A.log; then
                echo "Application is running"
                break
              else
                echo "Waiting for application to start..."
                sleep 5
              fi
            done
            if ! grep -q "Started BookStoreBackApplication" BACK-A.log; then
              echo "Application did not start in expected time" >&2
              exit 1
            fi

      # 유레카에 서버를 DOWN 상태로 알림
      - name: Notify Eureka to set instance status to DOWN
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Notifying Eureka to set instance status to DOWN..."
            curl -X POST http://localhost:${{ secrets.BACK_PORT }}/api/actuator/status
            echo "Eureka notified."

      # 유레카 로드밸런싱할 캐시 시간 (1분 대기)
      - name: Wait for traffic to shift
        run: sleep 60

        # 앱 포트로 실행된 jar 파일 종료
      - name: Stop existing Spring Boot application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Stopping existing application..."
            pid=$(lsof -t -i:${{ secrets.BACK_PORT_B }}) && kill -9 $pid || echo "No application running on port ${{ secrets.BACK_PORT_B }}"

      #앱 포트로 배포 한 jar 파일 실행
      - name: execute shell script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            echo "Starting new application..."
            source ~/.bashrc
            nohup java -Xmx256m -jar ~/target/BOOK-STORE-BACK.jar --spring.profiles.active=prod --server.port=${{ secrets.BACK_PORT_B }} --spring.datasource.password=${{ secrets.MYSQL_PASSWORD }} --spring.data.redis.password=${{ secrets.REDIS_PASSWORD }} > BACK-B.log 2>&1 &
            echo "New application started. Check app.log for details."